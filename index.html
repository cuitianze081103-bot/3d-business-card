<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evan Cui — 3D Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;background:#f4f3ee;color:#1d2a24}
main{padding:32px 20px;max-width:640px;width:100%}
h1{font-size:28px;font-weight:800;letter-spacing:.02em;margin:0 0 6px}
p{margin:0 0 28px;opacity:.65}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
a{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.08);transition:transform .2s}
a:active{transform:scale(.97)}
img{width:100%;display:block;aspect-ratio:1}
span{display:block;padding:14px 16px;font-weight:600}
</style></head><body><main>
<h1>EVAN CUI</h1><p>Interaction Design · ArtCenter College of Design</p>
<div class="grid">
<a href="forest/"><img src="forest/icon-512.png" alt="Forest card"><span>Forest Card</span></a>
<a href="ocean/"><img src="ocean/icon-512.png" alt="Ocean card"><span>Ocean Card</span></a>
</div></main></body></html>
