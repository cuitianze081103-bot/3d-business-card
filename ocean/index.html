    m.textContent = 'Error: ' + (e.message || e) + (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : '');
  });

<script>
/* ============ EDIT YOUR INFO HERE ============ */
const CONFIG = {
  name: 'EVAN CUI',
  title: 'Interaction Design',
  school: 'ArtCenter College of Design',
  contact: 'Pasadena, CA',
  link: 'https://cuitianze081103-bot.github.io/portfolio/',   // portfolio (long-press)
  qr: 'https://cuitianze081103-bot.github.io/3d-business-card/ocean/',   // QR opens this card
  linkLabel: 'Evan Cui · 3D card'
};
/* ============================================ */

if (typeof THREE === 'undefined') document.getElementById('msg').textContent = 'Could not load 3D engine.';
else init();

async function init() {
  try { await Promise.all([document.fonts.load('800 80px Inter'), document.fonts.load('500 40px Inter'), document.fonts.load('400 30px Inter'), document.fonts.load('600 30px Inter')]); } catch (e) {}
  const msgEl = document.getElementById('msg'); if (msgEl) msgEl.remove();

  const PI = Math.PI;
  const REAL = true;    // false = Version 1 (stylized), true = Version 2 (realistic)
  const W = 6.8, H = 4.2, T = 0.07, BEV = 0.02, S = T / 2 + BEV, FR = 0.13;   // thin card, thin frame
  const IW = W - 2 * FR, IH = H - 2 * FR;                                      // portal window size
  const MOBILE = true;   // same lighter settings on every device

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ---------- renderer / camera ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, stencil: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const SIDES = [], GRASS = [], SHELLG = []; let perfFrames = 0, perfStart = -1, perfDone = false, perfStep = 0;
  document.body.prepend(renderer.domElement);
  if (REAL) { renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.35; }
  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 200);

  const PXS = { value: 1 };
  let baseD = 10, zoom = 1, zoomT = 1;
  const ZMIN = 0.75, ZMAX = 5;
  const focus = new THREE.Vector3(), focusT = new THREE.Vector3();
  function placeCamera() { camera.position.set(0, 0.2, baseD / zoom); camera.lookAt(0, -0.1, 0); }
  function clampFocus() {
    const k = Math.max(0, 1 - 1 / zoomT);
    focusT.x = THREE.MathUtils.clamp(focusT.x, -3.3 * k, 3.3 * k);
    focusT.y = THREE.MathUtils.clamp(focusT.y, -2.0 * k, 2.0 * k);
    focusT.z = 0;
  }
  function fit() {
    const a = innerWidth / innerHeight;
    camera.aspect = a;
    const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    baseD = Math.max(4.5 / (t * a), 3.6 / t);
    PXS.value = innerHeight * renderer.getPixelRatio() / (2 * t);
    camera.updateProjectionMatrix();
    placeCamera();
    renderer.setSize(innerWidth, innerHeight);
  }
  fit();
  addEventListener('resize', fit);

  const hemi = new THREE.HemisphereLight(0xeaf8ff, REAL ? 0x3a8f96 : 0x6a7f8a, 0.8); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff4de, 0.9);
  sun.position.set(5, 8, 9);
  scene.add(sun);
  const sunDir = sun.position.clone().normalize();

  const FX = { uTime: { value: 0 }, uSwing: { value: new THREE.Vector2() } };

  // ---------- small helpers ----------
  function radialTex(inner, outer) {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, inner); gr.addColorStop(0.35, inner.replace(/[\d.]+\)$/, '0.55)')); gr.addColorStop(1, outer);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }
  const dotTex = radialTex('rgba(255,255,255,1)', 'rgba(255,255,255,0)');
  function roundRectShape(target, w, h, r) {
    const x = -w / 2, y = -h / 2;
    target.moveTo(x + r, y); target.lineTo(x + w - r, y); target.quadraticCurveTo(x + w, y, x + w, y + r);
    target.lineTo(x + w, y + h - r); target.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    target.lineTo(x + r, y + h); target.quadraticCurveTo(x, y + h, x, y + h - r);
    target.lineTo(x, y + r); target.quadraticCurveTo(x, y, x + r, y);
    return target;
  }
  function roundRectPath(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  // make everything under obj visible only through portal `ref`
  function portalize(obj, ref) {
    obj.traverse(o => {
      if (!o.material) return;
      (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
        m.stencilWrite = true; m.stencilRef = ref; m.stencilFunc = THREE.EqualStencilFunc;
        m.stencilFail = THREE.KeepStencilOp; m.stencilZFail = THREE.KeepStencilOp; m.stencilZPass = THREE.KeepStencilOp;
      });
      o.frustumCulled = false;
    });
  }
  const CAUSTIC = `
    float caus(vec2 p, float t){
      vec2 q = p; float acc = 0.0;
      for (int i = 0; i < 3; i++){
        float fi = float(i);
        q = vec2(q.x + 0.55 * sin(q.y * 1.3 + t * 0.7 + fi), q.y + 0.55 * cos(q.x * 1.1 - t * 0.6 + fi * 1.7));
        acc += pow(0.5 + 0.5 * sin(q.x * 2.4) * sin(q.y * 2.4), 7.0);
      }
      return acc;
    }`;

  // ---------- the card: thin frame + two portal windows ----------
  const card = new THREE.Group();
  scene.add(card);
  const frameShape = roundRectShape(new THREE.Shape(), W, H, 0.42);
  frameShape.holes.push(roundRectShape(new THREE.Path(), IW, IH, 0.3));
  const frameGeo = new THREE.ExtrudeGeometry(frameShape, { depth: T, bevelEnabled: true, bevelThickness: BEV, bevelSize: BEV, bevelSegments: 3, curveSegments: 24 });
  frameGeo.translate(0, 0, -T / 2);
  card.add(new THREE.Mesh(frameGeo, new THREE.MeshStandardMaterial({ color: 0xf4f1ea, roughness: 0.35, metalness: 0.15 })));

  const windowShape = roundRectShape(new THREE.Shape(), IW, IH, 0.3);
  [1, -1].forEach(sign => {
    const g = new THREE.ShapeGeometry(windowShape, 24);
    if (sign < 0) g.rotateY(PI);
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
      colorWrite: false, depthWrite: false, stencilWrite: true, stencilRef: sign > 0 ? 1 : 2,
      stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp
    }));
    m.position.z = sign * S * 0.6; m.renderOrder = -10;
    card.add(m);
  });

  // a side's root: y = up out of that face, depth = negative y; view coords (vx, vy) -> (vx, y, -vy)
  function sideRoot(sign) {
    const outer = new THREE.Group(); if (sign < 0) outer.rotation.y = PI;
    const root = new THREE.Group(); root.position.z = S * 0.6; root.rotation.x = PI / 2;
    outer.add(root); card.add(outer); SIDES.push({ o: outer, sign });
    return root;
  }
  const anim = [];          // per-frame callbacks (t, dt)
  const faceOnly = { front: [], back: [] };

  // ---------- labels on the glass ----------
  function nameTex() {
    const c = document.createElement('canvas'); c.width = 1024; c.height = 400;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(255,255,255,0.86)'; roundRectPath(g, 6, 6, 1012, 388, 46); g.fill();
    g.fillStyle = '#163545';
    try { g.letterSpacing = '3px'; } catch (e) {}
    g.font = '800 96px Inter, sans-serif'; g.fillText(CONFIG.name, 62, 150);
    try { g.letterSpacing = '0px'; } catch (e) {}
    g.fillStyle = '#25586a'; g.font = '500 44px Inter, sans-serif'; g.fillText(CONFIG.title, 64, 222);
    g.fillStyle = 'rgba(37,88,106,.78)'; g.font = '400 31px Inter, sans-serif';
    g.fillText(CONFIG.school, 64, 284); g.fillText(CONFIG.contact, 64, 330);
    // little wave mark
    g.strokeStyle = '#3fb4c9'; g.lineWidth = 7; g.lineCap = 'round';
    for (let k = 0; k < 2; k++) {
      g.beginPath();
      for (let x = 0; x <= 110; x += 4) g.lineTo(860 + x, 268 + k * 34 + Math.sin(x / 110 * PI * 2) * 12);
      g.stroke();
    }
    const t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso; return t;
  }
  function qrTex() {
    const c = document.createElement('canvas'); c.width = 512; c.height = 640;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(6,22,44,0.82)'; roundRectPath(g, 4, 4, 504, 632, 40); g.fill();
    g.strokeStyle = 'rgba(120,230,255,0.45)'; g.lineWidth = 3; roundRectPath(g, 4, 4, 504, 632, 40); g.stroke();
    const box = 384, bx = 64, by = 52;
    g.fillStyle = '#e8fbff'; roundRectPath(g, bx, by, box, box, 24); g.fill();
    if (typeof qrcode !== 'undefined') {
      const qr = qrcode(0, 'M'); qr.addData(CONFIG.qr); qr.make();
      const n = qr.getModuleCount(), cell = Math.floor((box - 44) / n), ox = bx + (box - cell * n) / 2, oy = by + (box - cell * n) / 2;
      g.fillStyle = '#06243a';
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (qr.isDark(y, x)) g.fillRect(ox + x * cell, oy + y * cell, cell, cell);
    }
    g.textAlign = 'center'; g.fillStyle = '#bff3ff';
    try { g.letterSpacing = '6px'; } catch (e) {}
    g.font = '600 28px Inter, sans-serif'; g.fillText('SCAN TO OPEN', 256, 522);
    try { g.letterSpacing = '0px'; } catch (e) {}
    g.fillStyle = 'rgba(191,243,255,.7)'; g.font = '400 26px Inter, sans-serif'; g.fillText(CONFIG.linkLabel, 256, 572);
    const t = new THREE.CanvasTexture(c); t.anisotropy = maxAniso; return t;
  }
  function glassLabel(root, tex, vx, vy, w, h) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h).rotateX(-PI / 2),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
    m.position.set(vx, 0.012, -vy); m.renderOrder = 20; root.add(m);
    return m;
  }

  // ---------- fish ----------
  const fishGeo = new THREE.SphereGeometry(1, 14, 10);
  const triGeo = new THREE.BufferGeometry();
  triGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, -1, 0.6, 0, -1, -0.6, 0], 3));
  triGeo.computeVertexNormals();
  function makeFish(o) {
    const std = c => new THREE.MeshStandardMaterial({ color: c, roughness: REAL ? 0.35 : 0.55, metalness: REAL ? 0.12 : 0, side: THREE.DoubleSide });
    const g = new THREE.Group();
    const body = new THREE.Mesh(fishGeo, std(o.body)); body.scale.set(0.5, o.tall || 0.3, 0.13); g.add(body);
    (o.bands || []).forEach(x => { const b = new THREE.Mesh(fishGeo, std(o.band)); b.scale.set(0.05, (o.tall || 0.3) * 1.02, 0.135); b.position.x = x; g.add(b); });
    const tail = new THREE.Group(); tail.position.x = -0.42; g.add(tail);
    const tm = new THREE.Mesh(triGeo, std(o.fin)); tm.scale.set(0.3, 0.32, 1); tail.add(tm);
    const dorsal = new THREE.Mesh(triGeo, std(o.fin)); dorsal.scale.set(0.3, 0.14, 1); dorsal.rotation.z = -PI / 2 + 0.5; dorsal.position.set(0.05, (o.tall || 0.3) * 0.9, 0); g.add(dorsal);
    [1, -1].forEach(sd => { const e = new THREE.Mesh(fishGeo, std('#101418')); e.scale.setScalar(0.045); e.position.set(0.32, 0.06, sd * 0.1); g.add(e); });
    g.scale.setScalar(o.size);
    return { g, tail };
  }
  // swim along a lissajous loop, facing the direction of travel
  function swimmer(f, cx, cy, cz, rx, ry, rz, speed, phase, minY, maxY) {
    let ys = null;
    anim.push(t => {
      const a = t * speed + phase;
      const x = cx + rx * Math.cos(a), z = cz + rz * Math.sin(a);
      let y = cy + ry * Math.sin(a * 2.0);
      if (minY) y = Math.max(y, minY(x, z));
      if (maxY != null) y = Math.min(y, maxY);
      ys = ys == null ? y : ys + (y - ys) * 0.08;      // glide smoothly over bumps
      y = ys;
      const vx = -rx * Math.sin(a), vz = rz * Math.cos(a), vy = 2 * ry * Math.cos(a * 2.0);
      f.g.position.set(x, y, z);
      f.g.rotation.set(0, Math.atan2(-vz * Math.sign(speed), vx * Math.sign(speed)), Math.atan2(vy, Math.hypot(vx, vz)) * 0.4 * Math.sign(speed));
      f.tail.rotation.y = Math.sin(t * 9 + phase * 3) * 0.45;
    });
  }

  // ---------- geometry merge helper: Group of meshes -> one BufferGeometry with grey "shade" vertex colors ----------
  function mergeGroup(group) {
    group.updateMatrixWorld(true);
    const parts = [];
    group.traverse(o => {
      if (!o.isMesh) return;
      const g = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone());
      g.applyMatrix4(o.matrixWorld);
      if (!g.attributes.normal) g.computeVertexNormals();
      parts.push([g, o.userData.shade == null ? 1 : o.userData.shade]);
    });
    let n = 0; parts.forEach(([g]) => { n += g.attributes.position.count; });
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
    let o = 0;
    parts.forEach(([g, sh]) => {
      const c = g.attributes.position.count;
      pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3);
      for (let i = 0; i < c; i++) {
        let v = sh;
        if (REAL) { const px = g.attributes.position.array[i * 3], py = g.attributes.position.array[i * 3 + 1], pz = g.attributes.position.array[i * 3 + 2];
          const nz = Math.sin(px * 127.1 + py * 311.7 + pz * 74.7) * 43758.5453; v *= 0.86 + 0.3 * (nz - Math.floor(nz)); }
        col[(o + i) * 3] = col[(o + i) * 3 + 1] = col[(o + i) * 3 + 2] = v;
      }
      o += c;
    });
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    out.setAttribute('color', new THREE.BufferAttribute(col, 3));
    return out;
  }
  const tagMesh = (geo, shade) => { const m = new THREE.Mesh(geo); m.userData.shade = shade; return m; };

  // shared wave function (GLSL + JS copies must match)
  const WAVE_Y = -0.085;      // bubbles stop just under here
  const LABEL = [-1.95, 1.3, 1.25 + 0.06, 0.49 + 0.06];   // name glass in root coords (x, z, half w, half h) — water stays flat there
  const ssJ = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
  function surfY(x, z, t) {      // must match the wave vertex shader
    const ex = Math.min(IW / 2 - Math.abs(x), IH / 2 - Math.abs(z));
    const qx = Math.abs(x - LABEL[0]) - LABEL[2], qz = Math.abs(z - LABEL[1]) - LABEL[3];
    const ld = Math.hypot(Math.max(qx, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qz), 0);
    const m = ssJ(0, 0.85, ex) * ssJ(0, 0.5, ld);
    const f = 0.5 + 0.5 * Math.sin(x * 3.0 + z * 0.3 - t * 1.5);
    const h = 0.03 + 0.13 * (2 * f * f * f - 0.35) + 0.03 * Math.sin(z * 1.9 - x * 0.6 - t * 1.0) + 0.012 * Math.sin((x + z) * 5.1 + t * 2.6) + 0.02 * Math.sin(x * 2.4 - z * 1.7 + t * 1.7);
    return h * m;
  }

  // ================= FRONT: Great Barrier Reef =================
  function buildReef() {
    const ref = 1, root = sideRoot(1), world = new THREE.Group(); root.add(world);
    const R = rng(7);
    const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: REAL ? 0.7 : 0.8, flatShading: !REAL }, o));
    const ss = (a, b, v) => { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); };
    // reef patches ("bommies") separated by sand channels
    const reefN = (x, z) => Math.sin(x * 0.7 + 1.3) * Math.cos(z * 0.9) + 0.6 * Math.sin(x * 1.6 - z * 1.2 + 2) + 0.4 * Math.sin(x * 0.3 + z * 0.5 + 0.7);
    const reefM = (x, z) => ss(-0.25, 0.45, reefN(x, z));
    const fy = (x, z) => -2.8 + 0.5 * reefM(x, z) + 0.1 * Math.sin(x * 2.3 + z * 1.7) + 0.06 * Math.sin(x * 4.1 - z * 3.3);

    // floor: sand / reef rock blend, moving caustics
    const sg = new THREE.PlaneGeometry(30, 30, 140, 140); sg.rotateX(-PI / 2);
    const sp = sg.attributes.position, rm = new Float32Array(sp.count);
    for (let i = 0; i < sp.count; i++) { const x = sp.getX(i), z = sp.getZ(i); sp.setY(i, fy(x, z)); rm[i] = reefM(x, z); }

  // ================= BACK: deep sea, tall volcano, research submarine =================
  function buildDeep() {
    const ref = 2, root = sideRoot(-1), world = new THREE.Group(); root.add(world);

    // rugged volcano built from a smooth profile + radial ridges and gullies
    function volcanoGeo(scale, seed) {
      const prof = [[0.02, 4.15], [0.45, 4.25], [0.62, 4.62], [0.82, 4.5], [1.2, 3.85], [1.7, 2.95], [2.3, 1.9], [2.9, 0.95], [3.5, 0.3], [4.1, 0]];

    const profAt = (P, r) => { if (r <= P[0].x) return P[0].y; for (let i = 1; i < P.length; i++) if (P[i].x >= r) { const a = P[i - 1], b = P[i]; return a.y + (b.y - a.y) * (r - a.x) / Math.max(1e-4, b.x - a.x); } return -99; };

      const f = makeFish({ body: '#2b3a52', fin: '#3a4d6b', size: 0.32 });
      const d = new THREE.Sprite(glow(0x6fe3ff, 0.8)); d.scale.setScalar(0.25); d.position.set(0.15, 0, 0.14); f.g.add(d);
      world.add(f.g); swimmer(f, (R() - 0.5) * 3, -2.0 - R() * 1.5, (R() - 0.5) * 2, 1.8, 0.1, 1.0, i ? 0.3 : -0.28, R() * 6, deepMin, -1.0);
    }
    {
      const N = MOBILE ? 180 : 280, pos = new Float32Array(N * 3), sd = [];
      for (let i = 0; i < N; i++) sd.push([(R() - 0.5) * 9, (R() - 0.5) * 6, R(), 0.015 + R() * 0.03]);
      const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      world.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.045, map: dotTex, color: 0xbfe9ff, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending })));
      anim.push(t => {
        sd.forEach(([x, z, ph, sp], i) => {
          let u = (ph - t * sp) % 1; if (u < 0) u += 1;
          pos[i * 3] = x + Math.sin(t * 0.3 + ph * 20) * 0.15; pos[i * 3 + 1] = -0.9 + (FLOOR + 1.1) * (1 - u); pos[i * 3 + 2] = z;
        });
        g.attributes.position.needsUpdate = true;
      });
    }

    // deep water darkness (below the sub)
    for (let i = 0; i < 12; i++) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(34, 34).rotateX(-PI / 2), new THREE.MeshBasicMaterial({ color: REAL ? 0x041d38 : 0x072a4d, transparent: true, opacity: REAL ? 0.085 : 0.07, depthWrite: false }));
      m.position.y = -1.9 - i * 0.45; world.add(m);
    }
    const top = new THREE.Mesh(new THREE.PlaneGeometry(34, 34).rotateX(-PI / 2), new THREE.MeshBasicMaterial({ color: 0x0b3a63, transparent: true, opacity: 0.18, depthWrite: false }));
    top.position.y = -1.5; world.add(top);
    portalize(world, ref);
    faceOnly.back.push(glassLabel(root, qrTex(), -2.3, -0.25, 1.55, 1.94));
  }

  const reef = buildReef();
  buildDeep();

  // ---------- interaction (same as the nature card) ----------
  const el = renderer.domElement;
  const REST_X = -0.42;
  let rotY = 0, rotX = REST_X, velY = 0, dragging = false, settleOn = true, target = 0, idleAmt = 1;
  let lastX = 0, lastY = 0, moved = 0, lastTap = 0;
  const ray = new THREE.Raycaster(), plane = new THREE.Plane(), ndc = new THREE.Vector2();
  const tmpN = new THREE.Vector3(), tmpO = new THREE.Vector3(), hit = new THREE.Vector3();
  function pickLocal(sx, sy) {
    card.updateMatrixWorld(); camera.updateMatrixWorld();
    ndc.set(sx / innerWidth * 2 - 1, -(sy / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    tmpN.set(0, 0, 1).applyQuaternion(card.quaternion);
    plane.setFromNormalAndCoplanarPoint(tmpN, card.getWorldPosition(tmpO));
    if (!ray.ray.intersectPlane(plane, hit)) return null;
    return card.worldToLocal(hit.clone());
  }
  function zoomAt(sx, sy, f) {
    const nz = THREE.MathUtils.clamp(zoomT * f, ZMIN, ZMAX);
    const P = pickLocal(sx, sy), r = zoomT / nz;
    if (P && nz > 1) { focusT.x = P.x + (focusT.x - P.x) * r; focusT.y = P.y + (focusT.y - P.y) * r; }
    zoomT = nz; clampFocus();
  }
  function panBy(x0, y0, x1, y1) {
    const A = pickLocal(x0, y0), B = pickLocal(x1, y1);
    if (!A || !B) return;
    focusT.x -= B.x - A.x; focusT.y -= B.y - A.y; clampFocus();
  }
  const pts = new Map();
  let pinchD = 0, pinchMX = 0, pinchMY = 0, wasPinch = false;
  const pinchInfo = () => { const [p, q] = [...pts.values()]; return { d: Math.hypot(p.x - q.x, p.y - q.y), mx: (p.x + q.x) / 2, my: (p.y + q.y) / 2 }; };
  el.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    if (pts.size === 2) { const p = pinchInfo(); pinchD = p.d; pinchMX = p.mx; pinchMY = p.my; dragging = false; wasPinch = true; settleOn = true; target = Math.round(rotY / PI) * PI; return; }
    if (pts.size > 2) return;
    wasPinch = false; dragging = true; settleOn = false; velY = 0; moved = 0;
    lastX = e.clientX; lastY = e.clientY; el.classList.add('dragging');
  });
  el.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) {
      const p = pinchInfo();
      if (pinchD > 0) zoomAt(p.mx, p.my, p.d / pinchD);
      panBy(pinchMX, pinchMY, p.mx, p.my);
      pinchD = p.d; pinchMX = p.mx; pinchMY = p.my; return;
    }
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
    const k = 0.009 / Math.sqrt(zoomT);
    rotY += dx * k; velY = dx * k;
    rotX = THREE.MathUtils.clamp(rotX + dy * 0.006 / Math.sqrt(zoomT), -1.2, 0.5);
  });
  const end = e => {
    pts.delete(e.pointerId);
    if (pts.size === 1 && wasPinch) { dragging = false; el.classList.remove('dragging'); return; }
    if (!dragging) return;
    dragging = false; el.classList.remove('dragging');
    if (moved < 8 && !wasPinch) {
      const now = performance.now();
      if (now - lastTap < 320) { if (zoomT > 1.15) { zoomT = 1; clampFocus(); } else flip(); lastTap = 0; } else lastTap = now;
    }
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('wheel', e => {
    e.preventDefault();
    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    zoomAt(e.clientX, e.clientY, Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015)));
  }, { passive: false });
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
  function flip() { velY = 0; target = Math.round(rotY / PI) * PI + PI; settleOn = true; }
  const flipBtn = document.getElementById('flip');
  flipBtn.addEventListener('click', flip);
  if (!matchMedia('(pointer: coarse)').matches) document.getElementById('hint').textContent = 'Drag to spin · Scroll to zoom · Double-click to flip / reset zoom · Hold to open portfolio';

  // ---------- long-press anywhere on the card → open portfolio ----------
  (function () {
    const HOLD = 650;
    const ring = document.createElement('div'); ring.id = 'hold'; document.body.appendChild(ring);
    const link = document.createElement('a'); link.id = 'toast'; link.href = CONFIG.link; link.target = '_blank'; link.rel = 'noopener';
    link.textContent = 'Open portfolio ↗'; document.body.appendChild(link);
    let t0 = 0, sx = 0, sy = 0, active = false, ready = false, raf = 0, showT = 0;
    const cancel = () => { active = false; ready = false; cancelAnimationFrame(raf); clearTimeout(showT); ring.classList.remove('show', 'ready'); };
    const draw = () => {
      if (!active) return;
      const p = Math.min(1, (performance.now() - t0) / HOLD);
      ring.style.setProperty('--p', p);
      if (p >= 1 && !ready) { ready = true; ring.classList.add('ready'); try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} }
      raf = requestAnimationFrame(draw);
    };
    el.addEventListener('pointerdown', e => {
      if (pts.size > 1) { cancel(); return; }
      active = true; ready = false; t0 = performance.now(); sx = e.clientX; sy = e.clientY;
      ring.style.left = sx + 'px'; ring.style.top = sy + 'px'; ring.style.setProperty('--p', 0);
      showT = setTimeout(() => { if (active) ring.classList.add('show'); }, 200);
      draw();
    });
    el.addEventListener('pointermove', e => { if (active && (Math.hypot(e.clientX - sx, e.clientY - sy) > 10 || pts.size > 1)) cancel(); });
    el.addEventListener('pointerup', () => {
      const go = active && ready; cancel();
      if (!go) return;
      lastTap = 0;
      link.classList.add('show'); setTimeout(() => link.classList.remove('show'), 4500);
      try { link.click(); } catch (err) {}        // if the viewer blocks it, the button stays tappable for a few seconds
    });
    el.addEventListener('pointercancel', cancel);
    el.addEventListener('contextmenu', e => e.preventDefault());
  })();

  // ---------- animation ----------
  const clock = new THREE.Clock();
  let lastT = 0, prevRY = 0, prevRX = REST_X;
  const sw = new THREE.Vector2(), swV = new THREE.Vector2();
  const nV = new THREE.Vector3(), hV = new THREE.Vector3(), cV = new THREE.Vector3();
  let frontShown = null;
  function tick() {
    const t = clock.getElapsedTime();
    const dt = Math.min(0.05, Math.max(0.001, t - lastT)); lastT = t;

    if (!dragging) {
      if (!settleOn) {
        rotY += velY; velY *= 0.93;
        if (Math.abs(velY) < 0.003) { target = Math.round(rotY / PI) * PI; settleOn = true; }
      } else rotY += (target - rotY) * 0.07;
      rotX += (REST_X - rotX) * 0.04;
    }
    zoom += (zoomT - zoom) * 0.18; focus.lerp(focusT, 0.18);
    placeCamera();
    idleAmt += ((dragging || zoomT > 1.3 ? 0 : 1) - idleAmt) * 0.03;
    card.rotation.set(rotX + 0.05 * Math.sin(t * 0.6) * idleAmt, rotY + 0.16 * Math.sin(t * 0.33) * idleAmt, 0);
    card.position.copy(focus).applyQuaternion(card.quaternion).negate();
    // ---- performance: only draw the face you can see (both while the card is edge-on) ----
    {
      const fn = new THREE.Vector3(0, 0, 1).applyQuaternion(card.quaternion);
      const cd = new THREE.Vector3().copy(camera.position).sub(card.position).normalize();
      const d = fn.dot(cd);
      SIDES.forEach(sd => { sd.o.visible = sd.sign > 0 ? d > -0.25 : d < 0.25; });
    }
    // ---- performance: step quality down until the device keeps up (resolution) ----
    if (!perfDone) {
      perfFrames++;
      if (t > 1.0 && perfStart < 0) { perfStart = t; perfFrames = 0; }
      if (perfStart > 0 && t - perfStart > 2.0) {
        const fps = perfFrames / (t - perfStart);
        perfStart = t; perfFrames = 0;
        if (fps >= 50) perfDone = true;
        else if (perfStep === 0) { perfStep = 1; if (renderer.getPixelRatio() > 1) { renderer.setPixelRatio(1); fit(); } }
        else perfDone = true;
      }
    }


    // water things lag behind when the card turns
    const dY = card.rotation.y - prevRY, dX = card.rotation.x - prevRX;
    prevRY = card.rotation.y; prevRX = card.rotation.x;
    swV.x += (-sw.x * 30 - swV.x * 3.5) * dt - dY * 2.2;
    swV.y += (-sw.y * 30 - swV.y * 3.5) * dt + dX * 2.2;
    sw.x = THREE.MathUtils.clamp(sw.x + swV.x * dt, -0.15, 0.15);
    sw.y = THREE.MathUtils.clamp(sw.y + swV.y * dt, -0.15, 0.15);
    FX.uSwing.value.set(sw.x, sw.y);
    FX.uTime.value = t;

    // which face is toward the camera
    nV.set(0, 0, 1).applyQuaternion(card.quaternion);
    cV.copy(camera.position).sub(card.position).normalize();
    const front = nV.dot(cV) > 0;
    if (front !== frontShown) {
      frontShown = front;
      faceOnly.front.forEach(o => { o.visible = front; });
      faceOnly.back.forEach(o => { o.visible = !front; });
      flipBtn.textContent = front ? 'Dive' : 'Surface';
    }
    const lit = THREE.MathUtils.smoothstep(nV.dot(cV), -0.35, 0.35);
    sun.intensity = 0.38 + 0.52 * lit; hemi.intensity = 0.35 + 0.45 * lit;
    hemi.color.setRGB(0.45 + 0.47 * lit, 0.6 + 0.37 * lit, 0.85 + 0.15 * lit);
    hV.copy(cV).add(sunDir).normalize();
    reef.glint.uniforms.uGlint.value = 0.05 + 0.45 * Math.pow(Math.max(0, nV.dot(hV)), 30);

    anim.forEach(f => f(t, dt));
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
}
</script>
